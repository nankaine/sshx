name: Build sshx (Static Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static sshx
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build sshx
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-musl \
            -p sshx

      - name: Strip binary
        run: |
          strip target/x86_64-unknown-linux-musl/release/sshx

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/sshx
          ldd target/x86_64-unknown-linux-musl/release/sshx || true

      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/sshx dist/
          tar -C dist -czf sshx-linux-amd64.tar.gz sshx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshx-linux-amd64
          path: sshx-linux-amd64.tar.gz
