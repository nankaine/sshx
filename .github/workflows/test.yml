name: Build Static sshx

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build \
            --release \
            --package sshx \
            --target x86_64-unknown-linux-musl

      - name: Strip binary
        run: |
          strip target/x86_64-unknown-linux-musl/release/sshx

      - name: Verify binary
        run: |
          file target/x86_64-unknown-linux-musl/release/sshx
          ldd target/x86_64-unknown-linux-musl/release/sshx || true

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/sshx dist/sshx-linux-amd64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshx-linux-amd64
          path: dist/sshx-linux-amd64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sshx-linux-amd64
