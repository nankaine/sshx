name: Reusable Build

on:
  workflow_call:
    inputs:
      target:
        description: Rust target triple
        required: true
        type: string

      artifact:
        description: Artifact name
        required: true
        type: string

      rustflags:
        description: Extra rustflags
        required: false
        type: string
        default: "-C target-feature=+crt-static"
    # 临时增加
    secrets:
      SSHX_DEFAULT_SERVER:
        required: true
    # 临时增加    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Detected version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"  

      - name: Patch default SSHX server
        shell: bash
        env:
          SSHX_DEFAULT_SERVER: ${{ secrets.SSHX_DEFAULT_SERVER }}
        run: |
          set -e

          if [ -z "$SSHX_DEFAULT_SERVER" ]; then
            echo "::error::Repository Secret SSHX_DEFAULT_SERVER is not set."
            exit 1
          fi

          sed -i \
            "s|default_value = \"https://sshx.io\"|default_value = \"${SSHX_DEFAULT_SERVER}\"|" \
            crates/sshx/src/main.rs

          if grep -q 'default_value = "https://sshx.io"' crates/sshx/src/main.rs; then
            echo "::error::Failed to patch default server."
            exit 1
          fi

          echo "Default server patched."

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Zig
        shell: bash
        run: |
          set -eux

          ZIG_VERSION=0.13.0

          wget https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        shell: bash
        run: |
          cargo install cargo-zigbuild --locked

      - name: Show tool versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          zig version
          protoc --version

      - name: Build sshx
        shell: bash
        env:
          RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          cargo zigbuild \
            --release \
            --target ${{ inputs.target }} \
            -p sshx

      - name: Strip binary
        shell: bash
        run: |
          llvm-strip target/${{ inputs.target }}/release/sshx || true
          strip target/${{ inputs.target }}/release/sshx || true

      - name: Verify binary
        shell: bash
        run: |
          echo "========== file =========="
          file target/${{ inputs.target }}/release/sshx

          echo "========== readelf =========="
          readelf -l target/${{ inputs.target }}/release/sshx | grep interpreter || true

          echo "========== ldd =========="
          ldd target/${{ inputs.target }}/release/sshx || true

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          cp target/${{ inputs.target }}/release/sshx dist/

          tar -C dist \
            -czf \
            ${{ inputs.artifact }}-v${{ steps.version.outputs.version }}.tar.gz \
            sshx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-v${{ steps.version.outputs.version }}
          path: ${{ inputs.artifact }}-v${{ steps.version.outputs.version }}.tar.gz