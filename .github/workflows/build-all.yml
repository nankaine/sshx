name: Build All Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd64:
    name: Build AMD64
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      SSHX_DEFAULT_SERVER: ${{ secrets.SSHX_DEFAULT_SERVER }}
    with:
      target: x86_64-unknown-linux-musl
      artifact: sshx-linux-amd64

  arm64:
    name: Build ARM64
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      SSHX_DEFAULT_SERVER: ${{ secrets.SSHX_DEFAULT_SERVER }}
    with:
      target: aarch64-unknown-linux-musl
      artifact: sshx-linux-arm64

  armv7:
    name: Build ARMv7
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      SSHX_DEFAULT_SERVER: ${{ secrets.SSHX_DEFAULT_SERVER }}
    with:
      target: armv7-unknown-linux-musleabihf
      artifact: sshx-linux-armv7

  armv6:
    name: Build ARMv6
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      SSHX_DEFAULT_SERVER: ${{ secrets.SSHX_DEFAULT_SERVER }}
    with:
      target: arm-unknown-linux-musleabihf
      artifact: sshx-linux-armv6
      rustflags: "-C target-feature=+crt-static -C target-cpu=arm1176jzf-s"

  package:
    name: Package All Platforms
    runs-on: ubuntu-latest

    needs:
      - amd64
      - arm64
      - armv7
      - armv6

    steps:
      - name: Download AMD64
        uses: actions/download-artifact@v4
        with:
          name: sshx-linux-amd64
          path: release/amd64

      - name: Download ARM64
        uses: actions/download-artifact@v4
        with:
          name: sshx-linux-arm64
          path: release/arm64

      - name: Download ARMv7
        uses: actions/download-artifact@v4
        with:
          name: sshx-linux-armv7
          path: release/armv7

      - name: Download ARMv6
        uses: actions/download-artifact@v4
        with:
          name: sshx-linux-armv6
          path: release/armv6

      - name: Show Files
        run: |
          echo "=========================="
          find release -type f
          echo "=========================="

      - name: Create Release ZIP
        run: |
          cd release
          zip -r ../sshx-all-platforms.zip .

      - name: Upload Combined Package
        uses: actions/upload-artifact@v4
        with:
          name: sshx-all-platforms
          path: sshx-all-platforms.zip