name: Build sshx (zigbuild)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            artifact: sshx-linux-amd64

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            artifact: sshx-linux-arm64

          - name: linux-armv7
            target: armv7-unknown-linux-musleabihf
            artifact: sshx-linux-armv7

          - name: linux-armv6
            target: arm-unknown-linux-musleabihf
            artifact: sshx-linux-armv6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            armv7-unknown-linux-musleabihf
            arm-unknown-linux-musleabihf

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Zig
        shell: bash
        run: |
          set -eux

          ZIG_VERSION=0.14.1

          wget -q https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Show Versions
        shell: bash
        run: |
          export PATH="$PWD/zig-linux-x86_64-0.14.1:$PATH"

          rustc --version
          cargo --version
          zig version
          protoc --version

      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          export PATH="$PWD/zig-linux-x86_64-0.14.1:$PATH"

          cargo zigbuild \
            --release \
            --target ${{ matrix.target }} \
            -p sshx

      - name: Verify
        shell: bash
        run: |
          file target/${{ matrix.target }}/release/sshx

          echo "========== ldd =========="
          ldd target/${{ matrix.target }}/release/sshx || true

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          cp \
            target/${{ matrix.target }}/release/sshx \
            dist/${{ matrix.artifact }}

          chmod +x dist/${{ matrix.artifact }}

          tar -czf \
            dist/${{ matrix.artifact }}.tar.gz \
            -C dist \
            ${{ matrix.artifact }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
