name: Build sshx All(Static Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            artifact: sshx-linux-amd64

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            artifact: sshx-linux-arm64

          - name: linux-armv7
            target: armv7-unknown-linux-musleabihf
            artifact: sshx-linux-armv7

          - name: linux-armv6
            target: arm-unknown-linux-musleabihf
            artifact: sshx-linux-armv6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            armv7-unknown-linux-musleabihf
            arm-unknown-linux-musleabihf

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: latest

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          zig version
          protoc --version

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo zigbuild \
            --release \
            --target ${{ matrix.target }} \
            -p sshx

      - name: Verify
        run: |
          file target/${{ matrix.target }}/release/sshx
          ldd target/${{ matrix.target }}/release/sshx || true

      - name: Package
        run: |
          mkdir -p dist

          cp \
            target/${{ matrix.target }}/release/sshx \
            dist/${{ matrix.artifact }}

          chmod +x dist/${{ matrix.artifact }}

          tar -C dist -czf \
            dist/${{ matrix.artifact }}.tar.gz \
            ${{ matrix.artifact }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
