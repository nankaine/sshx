name: Build Static sshx All

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-musl
            binary: sshx-linux-amd64

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            binary: sshx-linux-arm64

          - name: linux-armv7
            target: armv7-unknown-linux-musleabihf
            binary: sshx-linux-armv7

          - name: linux-armv6
            target: arm-unknown-linux-musleabihf
            binary: sshx-linux-armv6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (Host)
        uses: arduino/setup-protoc@v3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        run: cargo install cross --locked

      - name: Show Versions
        run: |
          rustc --version
          cargo --version
          cross --version
          protoc --version

      - name: Build
        env:
          CROSS_CONFIG: Cross.toml
        run: |
          cross build \
            --release \
            --target ${{ matrix.target }} \
            -p sshx

      - name: Verify Binary
        run: |
          file target/${{ matrix.target }}/release/sshx

      - name: Package
        run: |
          mkdir -p dist

          cp \
            target/${{ matrix.target }}/release/sshx \
            dist/${{ matrix.binary }}

          chmod +x dist/${{ matrix.binary }}

          tar -czf \
            dist/${{ matrix.binary }}.tar.gz \
            -C dist \
            ${{ matrix.binary }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}.tar.gz
