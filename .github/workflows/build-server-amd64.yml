name: Build sshx-server (AMD64)

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:

    name: Build sshx-server linux amd64
    runs-on: ubuntu-latest


    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # -----------------------------
      # Read version
      # -----------------------------
      - name: Read Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)

          echo "Detected version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # -----------------------------
      # protoc
      # -----------------------------
      - name: Install protoc
        uses: arduino/setup-protoc@v3


      # -----------------------------
      # Rust
      # -----------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl


      # -----------------------------
      # musl
      # -----------------------------
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools


      # -----------------------------
      # Node frontend
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"


      - name: Install frontend dependencies
        run: |
          npm ci


      - name: Build frontend
        run: |
          npm run build


      # -----------------------------
      # Cargo cache
      # -----------------------------
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2


      # -----------------------------
      # Build server
      # -----------------------------
      - name: Build sshx-server
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build \
            --release \
            --target x86_64-unknown-linux-musl \
            --bin sshx-server


      # -----------------------------
      # Strip
      # -----------------------------
      - name: Strip binary
        run: |
          strip \
          target/x86_64-unknown-linux-musl/release/sshx-server || true


      # -----------------------------
      # Verify
      # -----------------------------
      - name: Verify binary
        run: |
          file \
          target/x86_64-unknown-linux-musl/release/sshx-server

          ldd \
          target/x86_64-unknown-linux-musl/release/sshx-server || true


      # -----------------------------
      # Package
      # -----------------------------
      - name: Package
        shell: bash
        run: |
          mkdir dist

          cp \
          target/x86_64-unknown-linux-musl/release/sshx-server \
          dist/


          cp -r build dist/


          tar \
          -C dist \
          -czf \
          sshx-server-linux-amd64-v${{ steps.version.outputs.version }}.tar.gz \
          .


      # -----------------------------
      # Upload
      # -----------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:

          name: sshx-server-linux-amd64-v${{ steps.version.outputs.version }}

          path: sshx-server-linux-amd64-v${{ steps.version.outputs.version }}.tar.gz