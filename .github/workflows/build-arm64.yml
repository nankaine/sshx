name: Build ARM64 (zig cc)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Zig
        run: |
          ZIG_VERSION=0.13.0

          wget https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Install cargo config
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "zig"
          ar = "zig"
          EOF

      - name: Show Versions
        run: |
          export PATH="$PWD/zig-linux-x86_64-0.13.0:$PATH"

          zig version
          rustc --version
          cargo --version
          protoc --version

      - name: Build
        env:
          PATH: ${{ github.workspace }}/zig-linux-x86_64-0.13.0:${{ env.PATH }}

          CC_aarch64_unknown_linux_musl: "zig cc -target aarch64-linux-musl"

          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: zig

          AR_aarch64_unknown_linux_musl: "zig ar"

          RUSTFLAGS: "-C target-feature=+crt-static"

        run: |
          cargo build \
            --release \
            --target aarch64-unknown-linux-musl \
            -p sshx

      - name: Verify
        run: |
          file target/aarch64-unknown-linux-musl/release/sshx

      - name: Package
        run: |
          mkdir dist

          cp target/aarch64-unknown-linux-musl/release/sshx dist/

          tar -C dist -czf sshx-linux-arm64.tar.gz sshx

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sshx-linux-arm64
          path: sshx-linux-arm64.tar.gz