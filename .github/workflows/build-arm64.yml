name: Build ARM64 (Zig)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig
        run: |
          ZIG_VERSION=0.13.0

          wget https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz

          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Configure Cargo
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-musl]
          linker = "$(pwd)/tools/zigcc-aarch64"
          ar = "$(pwd)/tools/zigar"
          EOF

      - name: Build
        env:
          CC_aarch64_unknown_linux_musl: ${{ github.workspace }}/tools/zigcc-aarch64
          AR_aarch64_unknown_linux_musl: ${{ github.workspace }}/tools/zigar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ github.workspace }}/tools/zigcc-aarch64
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build \
            --release \
            --target aarch64-unknown-linux-musl \
            -p sshx

      - name: Verify
        run: |
          file target/aarch64-unknown-linux-musl/release/sshx

          ldd target/aarch64-unknown-linux-musl/release/sshx || true

      - name: Package
        run: |
          mkdir dist
          cp target/aarch64-unknown-linux-musl/release/sshx dist/
          tar -C dist -czf sshx-linux-arm64.tar.gz sshx

      - uses: actions/upload-artifact@v4
        with:
          name: sshx-linux-arm64
          path: sshx-linux-arm64.tar.gz