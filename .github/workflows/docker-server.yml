name: Build sshx-server Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:

  #
  # Build binary amd64
  #
  build-amd64:
    name: Build sshx-server amd64
    uses: ./.github/workflows/build-server-amd64.yml


  #
  # Build binary arm64
  #
  build-arm64:
    name: Build sshx-server arm64
    uses: ./.github/workflows/build-server-arm64.yml



  #
  # Docker Multi Arch
  #
  docker:

    name: Build Multi Arch Docker Image

    runs-on: ubuntu-latest

    needs:
      - build-amd64
      - build-arm64


    steps:

      - name: Checkout
        uses: actions/checkout@v4



      #
      # Download amd64 artifact
      #
      - name: Download amd64
        uses: actions/download-artifact@v4
        with:
          pattern: sshx-server-linux-amd64-*
          path: artifacts/amd64
          merge-multiple: true



      #
      # Download arm64 artifact
      #
      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          pattern: sshx-server-linux-arm64-*
          path: artifacts/arm64
          merge-multiple: true



      #
      # Prepare Docker contexts
      #
      - name: Prepare contexts
        shell: bash
        run: |

          mkdir -p docker/amd64
          mkdir -p docker/arm64


          tar xf \
          artifacts/amd64/*.tar.gz \
          -C docker/amd64


          tar xf \
          artifacts/arm64/*.tar.gz \
          -C docker/arm64


          echo "AMD64:"
          ls -R docker/amd64


          echo "ARM64:"
          ls -R docker/arm64



      #
      # Setup buildx
      #
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3



      #
      # Login GHCR
      #
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      #
      # Docker metadata
      #
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:

          images: |
            ghcr.io/${{ github.repository_owner }}/sshx-server

          tags: |
            type=raw,value=latest



      #
      # Build amd64
      #
      - name: Build amd64 image
        uses: docker/build-push-action@v6

        with:

          context: docker/amd64

          file: Dockerfile.server

          platforms: linux/amd64

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/sshx-server:amd64



      #
      # Build arm64
      #
      - name: Build arm64 image
        uses: docker/build-push-action@v6

        with:

          context: docker/arm64

          file: Dockerfile.server

          platforms: linux/arm64

          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/sshx-server:arm64



      #
      # Create manifest
      #
      - name: Create multi arch manifest
        shell: bash
        run: |

          docker buildx imagetools create \
          -t ghcr.io/${{ github.repository_owner }}/sshx-server:latest \
          ghcr.io/${{ github.repository_owner }}/sshx-server:amd64 \
          ghcr.io/${{ github.repository_owner }}/sshx-server:arm64